name: wetland_example
description: "Wetland example"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.10.0"
dependencies:
  flutter:
    sdk: flutter

  wetland:
    path: ../

  auto_route: ^11.2.0
  skeletonizer: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.0.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
