name: wetland

description: Adaptive navigation on any device for Flutter
homepage: https://github.com/insightop/wetland
version: 0.0.1

environment:
  sdk: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # 自适应
  # flutter_adaptive_scaffold: ^0.3.1 # discontinued
  custom_adaptive_scaffold: ^5.3.0 # community-edition of flutter_adaptive_scaffold
  # 路由管理
  auto_route: ^11.1.0
  # 状态管理
  flutter_bloc: ^9.0.0
  # 代码生成
  freezed_annotation: ^3.0.0

  flutter_logcat: ^1.2.8
  bloc: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.1
  auto_route_generator: ^10.0.0

flutter:
  uses-material-design: true
