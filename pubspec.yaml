name: wetland
description: Adaptive navigation on any device for Flutter
homepage: https://github.com/insightop/wetland
version: 0.0.1

environment:
  sdk: ">=3.6.0"

dependencies:
  flutter:
    sdk: flutter

  # 自适应
  flutter_adaptive_scaffold: ^0.3.1
  # 路由管理
  auto_route: ^9.2.2
  # 状态管理
  flutter_bloc: ^8.1.6
  # 代码生成
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  auto_route_generator: ^9.0.0

flutter:
  uses-material-design: true
