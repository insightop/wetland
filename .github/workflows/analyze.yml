# 阶段 1/5：静态分析。由 ci.yml 调度（也可单独复用）。
#
# 本文件是**可复用 workflow**：不自行监听 push / PR，只由 ci.yml 调用。
# 这样每次 push 只产生一条 CI 运行记录，而阶段仍是独立 job、可单独重跑。
name: Analyze

on:
  workflow_call:

jobs:
  analyze:
    name: 静态分析
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: 生成 example 路由代码
        # router.gr.dart 已入库；重新生成可确保它与 router.dart 保持一致。
        working-directory: example
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 检查生成物是否与入库版本一致
        # 只查**生成的路由文件**：router.gr.dart 已入库，若它与 router.dart 不一致，
        # 说明有人改了路由却没提交生成结果。
        #
        # 刻意不写 `git diff --exit-code`（全仓库）：`flutter pub get` 会按当前 SDK
        # 重写 example/pubspec.lock 的 sdks 约束（CI 的 Flutter 版本比本地新时，
        # 例如 dart 3.12→3.13、flutter 3.32→3.47），那与「忘了提交生成物」无关，
        # 却会让这个门槛在**每个** PR 上误报失败。实测确认过这一误报。
        run: git diff --exit-code -- example/lib/router/router.gr.dart

      - name: 分析根包
        run: flutter analyze --fatal-infos

      - name: 分析 example
        working-directory: example
        run: flutter analyze --fatal-infos
