# 阶段 1/5：静态分析。每次推送与所有 PR 都跑。
#
# 拆成独立 workflow 的理由：失败信息直接对应职责，且各阶段可独立重跑。
# 本阶段只保证「代码可分析、生成物已提交」，不跑测试、不构建。
name: Analyze

on:
  # 只在 main 上响应 push。其它分支与所有 PR 由 pull_request 触发 ——
  # 同时开 push(branches: "**") 与 pull_request 会让「向本仓库分支推提交」
  # 的 PR 触发两次（一次来自分支 push、一次来自 PR 事件），
  # 例如 dependabot 的 PR 就会整轮跑两遍，白耗 runner。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一 ref 的新推送取消旧运行，避免排队浪费。
concurrency:
  group: analyze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 静态分析
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: 生成 example 路由代码
        # router.gr.dart 已入库；重新生成可确保它与 router.dart 保持一致。
        working-directory: example
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 检查生成物是否与入库版本一致
        # 只查**生成的路由文件**：router.gr.dart 已入库，若它与 router.dart 不一致，
        # 说明有人改了路由却没提交生成结果。
        #
        # 刻意不写 `git diff --exit-code`（全仓库）：`flutter pub get` 会按当前 SDK
        # 重写 example/pubspec.lock 的 sdks 约束（CI 的 Flutter 版本比本地新时，
        # 例如 dart 3.12→3.13、flutter 3.32→3.47），那与「忘了提交生成物」无关，
        # 却会让这个门槛在**每个** PR 上误报失败。实测确认过这一误报。
        run: git diff --exit-code -- example/lib/router/router.gr.dart

      - name: 分析根包
        run: flutter analyze --fatal-infos

      - name: 分析 example
        working-directory: example
        run: flutter analyze --fatal-infos
