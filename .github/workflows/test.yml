# 阶段 2/5：测试。由 ci.yml 调度（也可单独复用）。
#
# 本文件是**可复用 workflow**：不自行监听 push / PR，只由 ci.yml 调用。
# 这样每次 push 只产生一条 CI 运行记录，而阶段仍是独立 job、可单独重跑。
name: Test

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Test library
        run: flutter test

      - name: Test example
        working-directory: example
        run: flutter test
