# 阶段 4/5：发布产物。仅在明确发版（推送 vX.Y.Z tag）时运行。
#
# 它**复用 build.yml** 而不是自己重复一遍五平台构建：
#   - 产物落在同一次 run 内，下面的 download-artifact 无需 run-id / token；
#   - 构建逻辑只有一份，改平台矩阵时不会出现「日常构建改了、发布没改」的偏差。
#
# 关于 GitHub Release 与 pub.dev 的分工：本文件只产出「平台产物」；
# 发布到 pub.dev 由 publish.yml 负责（pub.dev 只接受 tag 触发的运行，
# 且发布的是源码包，不需要这些平台产物）。
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  # 创建 Release 并上传产物需要写权限。
  contents: write

jobs:
  # 复用阶段 3 的五平台构建。产物名称与 build.yml 中的 asset 一致。
  build:
    name: Build (5 platforms)
    uses: ./.github/workflows/build.yml

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          # 各平台 artifact 合入同一目录，便于一次性作为 Release 资产上传。
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - name: Create Release with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**
