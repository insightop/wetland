# 持续集成：任何分支的推送与所有 PR 都跑。
#
# 设计原则：
# - 只做质量门禁（分析 + 测试），不掺发布逻辑；发布见 release.yml / publish.yml。
# - 用上游成熟 action（subosito/flutter-action）管理 SDK，不手搓安装脚本。
# - 根包与 example 分开成两个 job，并行跑，失败信息更清晰。
#
# 刻意**不**加 `dart format` 门禁：当前 SDK（Dart 3.13 的新格式化器）判定仓库中
# 37 个文件（含大量与本次改动无关的既有文件）需要重排空白与行尾。加上门禁会让
# CI 首次运行即失败，并迫使一次全仓库重排——那是独立的改动，不应混进本次 CI 搭建。
name: CI

on:
  push:
    # 任何分支都跑（含 main）；tag 推送由 release.yml / publish.yml 负责。
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的新推送取消旧的运行，避免排队浪费。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 静态分析
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖（根包）
        run: flutter pub get

      - name: 拉取依赖（example）
        working-directory: example
        run: flutter pub get

      - name: 生成 example 路由代码
        # router.gr.dart 已入库，但重新生成可确保它与 router.dart 保持一致
        # （若有人改了路由却忘了重新生成，这一步会让下面的 analyze 暴露问题）。
        working-directory: example
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 检查重新生成后是否有差异
        # 生成物若与入库版本不一致，说明有人忘了提交生成结果。
        run: git diff --exit-code

      - name: 分析根包
        run: flutter analyze --fatal-infos

      - name: 分析 example
        working-directory: example
        run: flutter analyze --fatal-infos

  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: 测试库
        run: flutter test

      - name: 测试 example
        working-directory: example
        run: flutter test

  # 保证 example 在各目标平台上确实能构建（库本身不产出产物，
  # 平台产物由 release.yml 在打 tag 时构建）。
  example-build:
    name: example 构建（${{ matrix.platform }}）
    needs: [analyze, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            build: flutter build linux --release
          - platform: windows
            os: windows-latest
            build: flutter build windows --release
          - platform: macos
            os: macos-latest
            build: flutter build macos --release
          - platform: android
            os: ubuntu-latest
            build: flutter build apk --release
          - platform: ios
            os: macos-latest
            # 无签名构建：仓库未配置证书，用 --no-codesign 验证可编译即可。
            build: flutter build ios --release --no-codesign
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: Linux 系统依赖
        if: matrix.platform == 'linux'
        # Flutter 的 Linux 桌面构建需要 GTK 开发库。
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: 构建
        run: ${{ matrix.build }}
