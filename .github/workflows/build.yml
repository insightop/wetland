# 阶段 3/5：构建。每次推送与所有 PR 都跑，并把五平台产物上传为 artifacts。
#
# ## 为什么是 workflow_call
#
# 本文件同时被三种入口使用：
#   - 每次 push / PR（下方 `on.push` / `on.pull_request`）—— 验证五平台可构建；
#   - release.yml 通过 `uses: ./.github/workflows/build.yml` 复用 —— 直接消费
#     本次 run 产出的 artifacts 来创建 Release。
#
# 选择「可复用 workflow」而不是让 release 用 workflow_run 去**跨 run**取产物：
#   - 产物落在**同一次 run** 内，`download-artifact` 不需要 run-id 与 token；
#   - 不会有「每个 commit 的 build 完成都触发一次 release」的问题；
#   - workflow_run 也不提供 ref_type，只能拿 head_branch 名字反推是不是 tag。
#
# ## 关于签名
# 仓库未配置签名证书（iOS/macOS）与 keystore（Android），故产物**未签名**：
# iOS 无法装真机，Android 用 debug 签名。仅用于验证可构建与内部测试。
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  # release.yml 调用时 github.workflow 为调用方的名字，因此不会与日常 build 互踢。
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            build: flutter build linux --release
            output: example/build/linux/x64/release/bundle
            asset: wetland-example-linux.tar.gz
          - platform: windows
            os: windows-latest
            build: flutter build windows --release
            output: example/build/windows/x64/runner/Release
            asset: wetland-example-windows.zip
          - platform: macos
            os: macos-latest
            build: flutter build macos --release
            output: example/build/macos/Build/Products/Release/wetland_example.app
            asset: wetland-example-macos.tar.gz
          - platform: android
            os: ubuntu-latest
            build: flutter build apk --release
            # Flutter 的 APK 输出名固定为 app-release.apk，故需重命名。
            output: example/build/app/outputs/flutter-apk/app-release.apk
            asset: wetland-example-android.apk
          - platform: ios
            os: macos-latest
            # 无签名证书：--no-codesign 产出未签名 .app（无 .ipa）。
            build: flutter build ios --release --no-codesign
            output: example/build/ios/iphoneos/Runner.app
            asset: wetland-example-ios.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: Linux 系统依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: 构建
        run: ${{ matrix.build }}

      - name: 压缩打包（桌面与 iOS 的目录型产物）
        # 目录型产物必须压成单文件：artifact 上传不保留可执行权限位，
        # 且 macOS 的 .app 依赖目录结构与符号链接。
        if: matrix.platform != 'android' && matrix.platform != 'windows'
        shell: bash
        working-directory: .
        run: |
          out='${{ matrix.output }}'
          tar -czf '${{ matrix.asset }}' -C "$(dirname "$out")" "$(basename "$out")"

      - name: 压缩打包（Windows）
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: .
        run: Compress-Archive -Path "${{ matrix.output }}/*" -DestinationPath "${{ matrix.asset }}"

      - name: 重命名单文件产物（Android）
        if: matrix.platform == 'android'
        shell: bash
        working-directory: .
        run: cp '${{ matrix.output }}' '${{ matrix.asset }}'

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: wetland-example-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          # 产物由 release 消费；7 天足够覆盖「提交后打 tag」的窗口，
          # 超期则 release 会因找不到文件而失败（可见，不会静默出错包）。
          retention-days: 7
