# 阶段 3/5：构建五平台并上传 artifacts。
#
# ## 为什么是 workflow_call
#
# 本文件被两种入口复用，因此**不自行监听 push / PR**（否则每次推送会另外
# 产生一条运行记录）：
#   - `ci.yml` 调度它 —— 每次 push / PR 验证五平台可构建；
#   - `release.yml` 复用它 —— 直接消费**同一次 run** 内的 artifacts 创建 Release。
#
# 选择「可复用 workflow」而不是让 release 用 workflow_run 去**跨 run**取产物：
#   - 产物落在同一次 run 内，`download-artifact` 不需要 run-id 与 token；
#   - 不会有「每个 commit 的 build 完成都触发一次 release」的问题；
#   - workflow_run 也不提供 ref_type，只能拿 head_branch 名字反推是不是 tag。
#
# ## 关于签名
# 仓库未配置签名证书（iOS/macOS）与 keystore（Android），故产物**未签名**：
# iOS 无法装真机，Android 用 debug 签名。仅用于验证可构建与内部测试。
name: Build

on:
  # 只作为可复用 workflow：由 ci.yml 调度（日常构建）与 release.yml 复用（发版产物）。
  # 不自行监听 push / PR，否则每次推送会另外产生一条运行记录。
  workflow_call:
  workflow_dispatch:

# 刻意不声明 concurrency：本文件是**被调用**的 workflow，与调用方属于同一次 run，
# 因此调用方（ci.yml）的 cancel-in-progress 已经覆盖它。在被调用方另设 group
# 反而会引入「同名 group 互相取消」的不确定性。
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            build: flutter build linux --release
            output: example/build/linux/x64/release/bundle
            asset: wetland-example-linux.tar.gz
          - platform: windows
            os: windows-latest
            build: flutter build windows --release
            output: example/build/windows/x64/runner/Release
            asset: wetland-example-windows.zip
          - platform: macos
            os: macos-latest
            build: flutter build macos --release
            output: example/build/macos/Build/Products/Release/wetland_example.app
            asset: wetland-example-macos.tar.gz
          - platform: android
            os: ubuntu-latest
            build: flutter build apk --release
            # Flutter 的 APK 输出名固定为 app-release.apk，故需重命名。
            output: example/build/app/outputs/flutter-apk/app-release.apk
            asset: wetland-example-android.apk
          - platform: ios
            os: macos-latest
            # 无签名证书：--no-codesign 产出未签名 .app（无 .ipa）。
            build: flutter build ios --release --no-codesign
            output: example/build/ios/iphoneos/Runner.app
            asset: wetland-example-ios.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build
        run: ${{ matrix.build }}

      - name: Archive (desktop and iOS bundles)
        # 目录型产物必须压成单文件：artifact 上传不保留可执行权限位，
        # 且 macOS 的 .app 依赖目录结构与符号链接。
        if: matrix.platform != 'android' && matrix.platform != 'windows'
        shell: bash
        working-directory: .
        run: |
          out='${{ matrix.output }}'
          tar -czf '${{ matrix.asset }}' -C "$(dirname "$out")" "$(basename "$out")"

      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: .
        run: Compress-Archive -Path "${{ matrix.output }}/*" -DestinationPath "${{ matrix.asset }}"

      - name: Rename Android APK
        if: matrix.platform == 'android'
        shell: bash
        working-directory: .
        run: cp '${{ matrix.output }}' '${{ matrix.asset }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wetland-example-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          # 产物由 release 消费；7 天足够覆盖「提交后打 tag」的窗口，
          # 超期则 release 会因找不到文件而失败（可见，不会静默出错包）。
          retention-days: 7
